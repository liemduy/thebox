
<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#121212" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Liem Planner" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon.svg" />
  <title>Liem's Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --core: #1A1E23;
      --muted: #5D6064;
      --bg: #FAFAFA;
      --white: #FFFFFF;
      --coral: #FF9780;
      --coral-2: #EFA08F;
      --blush: #FFEAE6;
      --border: #E8E3E1;
      --input: #CCCCCC;
      --success: #289E43;
      --warning: #F59E0B;
      --danger: #D32F2F;
      --shadow: rgba(26, 30, 35, 0.1) 0px 0px 10px 0px;
      --lift: rgba(26, 30, 35, 0.08) 0px 4px 12px 0px;
      --deep: rgba(26, 30, 35, 0.18) 0px 12px 28px;
      --safe-top: env(safe-area-inset-top);
      --safe-bottom: env(safe-area-inset-bottom);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--core); }
    body {
      overflow-x: hidden;
      font-family: "Inter Tight", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }
    button, input { font: inherit; }
    button { border: 0; cursor: pointer; }
    a { color: inherit; }

    .phone {
      width: 100%;
      max-width: 520px;
      min-height: 100dvh;
      margin: 0 auto;
      background: var(--bg);
      position: relative;
    }

    .screen, .editor, .auth-screen, .boot-screen {
      min-height: 100dvh;
      padding: calc(14px + var(--safe-top)) 16px calc(96px + var(--safe-bottom));
    }

    .auth-screen, .boot-screen { display: grid; place-items: center; padding-bottom: calc(24px + var(--safe-bottom)); }

    .topbar, .editorbar {
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .editorbar {
      position: sticky;
      top: 0;
      z-index: 12;
      padding-top: 2px;
      background: linear-gradient(var(--bg) 82%, rgba(250,250,250,0));
    }

    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .mark {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--core);
      color: var(--white);
      display: grid;
      place-items: center;
      font-size: 15px;
      flex: 0 0 auto;
    }
    .brand-title { font-size: 20px; line-height: 1; font-weight: 500; white-space: nowrap; }

    .top-actions { display: inline-flex; align-items: center; gap: 7px; flex: 0 0 auto; }
    .sync-pill {
      min-height: 34px;
      max-width: 96px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--white);
      color: var(--muted);
      font-size: 12px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sync-pill.saving { color: var(--warning); border-color: rgba(245,158,11,.28); background: rgba(245,158,11,.08); }
    .sync-pill.saved { color: var(--success); border-color: rgba(40,158,67,.24); background: rgba(40,158,67,.08); }
    .sync-pill.error, .sync-pill.offline { color: var(--danger); border-color: rgba(211,47,47,.22); background: rgba(211,47,47,.06); }

    .mode-nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 0 0 14px;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--white);
      box-shadow: var(--shadow);
    }
    .tab-btn {
      min-height: 44px;
      border-radius: 999px;
      background: var(--core);
      color: var(--white);
      font-size: 14px;
      transition: opacity .16s ease, background .16s ease, transform .16s ease;
    }
    .tab-btn.ghost { background: transparent; color: var(--core); opacity: .34; }
    .tab-btn:active, .chip:active, .icon-btn:active, .round-btn:active { transform: scale(.96); }

    .icon-btn, .round-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--white);
      border: 1px solid var(--border);
      color: var(--core);
      display: grid;
      place-items: center;
      font-size: 22px;
      line-height: 1;
      flex: 0 0 auto;
      transition: transform .16s ease, background .16s ease, box-shadow .16s ease;
    }
    .round-btn.primary { background: var(--coral); border-color: var(--coral); color: var(--white); }
    .round-btn.danger { color: var(--muted); background: var(--white); }
    .small-icon { width: 38px; height: 38px; font-size: 18px; }

    .filters, .tool-row {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 1px 14px;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar, .tool-row::-webkit-scrollbar { display: none; }
    .chip {
      min-height: 38px;
      padding: 0 13px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--white);
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
      transition: transform .16s ease, background .16s ease, color .16s ease;
    }
    .chip.active { background: var(--core); border-color: var(--core); color: var(--white); }
    .chip.coral { background: var(--coral); color: var(--white); border-color: var(--coral); }

    .project-stack, .day-list, .search-results, .box-editor-tree, .action-tree { display: grid; gap: 14px; }
    .project-stack.dragging { user-select: none; }

    .project-card, .day-card, .template-card, .action-node, .summary-day, .auth-card, .tools-sheet, .search-result {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: none;
    }
    .project-card {
      min-height: 132px;
      padding: 18px;
      display: grid;
      gap: 12px;
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease, opacity .16s ease;
    }
    .project-card:hover, .day-card:hover, .search-result:hover { border-color: #D4D0CC; box-shadow: var(--lift); }
    .project-card.dragging { opacity: .45; transform: scale(.985); box-shadow: var(--deep); }

    .project-head, .node-head, .day-head, .summary-head, .action-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
    }
    .project-left { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
    .inline-actions { display: inline-flex; align-items: center; gap: 7px; flex: 0 0 auto; }

    .drag-handle {
      width: 34px;
      height: 44px;
      border-radius: 14px;
      background: var(--bg);
      color: var(--muted);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      touch-action: none;
      cursor: grab;
    }
    .drag-handle:active { cursor: grabbing; background: var(--blush); }

    .editable-title {
      outline: 0;
      min-width: 0;
      word-break: break-word;
      border-radius: 10px;
      padding: 2px 0;
    }
    .editable-title:focus {
      box-shadow: 0 0 0 3px rgba(255,151,128,.12);
      background: rgba(255,234,230,.55);
    }
    .editable-title:empty::before, .rich-editor:empty::before {
      content: attr(data-placeholder);
      color: #9B9B9B;
      pointer-events: none;
    }

    .home-title { font-size: 28px; font-weight: 400; line-height: 1.12; }
    .editor-title { font-size: clamp(34px, 10vw, 48px); font-weight: 400; line-height: 1.08; }
    .sub-title, .action-title { font-size: 18px; line-height: 23px; font-weight: 400; }
    .muted { color: var(--muted); }
    .section-label { color: var(--muted); font-size: 13px; line-height: 18px; padding: 0 2px; }
    .empty-card {
      min-height: 220px;
      border: 1px dashed var(--coral);
      border-radius: 18px;
      background: var(--blush);
      color: var(--core);
      display: grid;
      place-items: center;
      text-align: center;
      font-size: 22px;
    }

    .mini-tree, .summary-list { display: grid; gap: 7px; }
    .mini-row, .summary-row {
      border-left: 1px solid var(--border);
      padding-left: 10px;
      margin-left: calc(var(--depth, 0) * 12px);
      color: var(--muted);
      font-size: 14px;
      line-height: 19px;
    }
    .mini-row.rootish { color: var(--core); }

    .project-summary { display: grid; gap: 10px; }
    .summary-day { overflow: hidden; background: var(--bg); }
    .summary-head, .day-head {
      min-height: 58px;
      padding: 0 16px;
      background: transparent;
      color: var(--core);
      text-align: left;
    }
    .summary-body, .day-body { padding: 0 12px 12px; display: grid; gap: 10px; }
    .summary-action {
      width: 100%;
      display: grid;
      gap: 4px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--white);
      text-align: left;
      color: var(--core);
    }
    .summary-action-title { font-size: 14px; line-height: 19px; display: flex; align-items: center; gap: 7px; }
    .summary-action-text { color: var(--muted); font-size: 13px; line-height: 18px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .done-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1px solid var(--input);
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      color: transparent;
      font-size: 11px;
    }
    .done-dot.done { background: var(--success); border-color: var(--success); color: var(--white); }
    .chev { transition: transform .16s ease; display: inline-grid; place-items: center; }
    .collapsed .chev { transform: rotate(-90deg); }

    .create-today {
      width: 100%;
      min-height: 56px;
      border-radius: 999px;
      background: var(--coral);
      color: var(--white);
      font-size: 15px;
      margin-bottom: 16px;
      box-shadow: var(--lift);
    }
    .create-today.secondary { background: var(--core); }
    .action-date-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      position: relative;
    }
    .date-pill {
      width: 100%;
      min-height: 54px;
      padding: 0 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--white);
      color: var(--core);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: var(--shadow);
    }
    .date-pill span { font-size: 18px; display: inline-block; color: var(--muted); }
    .date-pill strong { font-weight: 500; flex: 1; text-align: left; }
    .date-pill em { font-style: normal; color: var(--muted); font-size: 13px; }
    .native-date {
      position: absolute;
      right: 0;
      top: 0;
      width: 54px;
      height: 54px;
      opacity: 0;
      pointer-events: auto;
    }
    .recent-label { margin-top: 22px; }
    .compact-days .day-card { opacity: .92; }

    .day-card { overflow: hidden; }
    .day-meta { color: var(--muted); font-size: 13px; line-height: 18px; }
    .progress-track { height: 8px; border-radius: 999px; background: var(--blush); overflow: hidden; margin-top: 2px; }
    .progress-fill { height: 100%; background: var(--success); border-radius: inherit; width: var(--progress, 0%); }

    .editor { padding-bottom: calc(112px + var(--safe-bottom)); }
    .editor-kicker { font-size: 13px; color: var(--muted); line-height: 18px; min-width: 0; }
    .template-card { padding: 14px; display: grid; gap: 10px; }
    .node-head { min-height: 54px; }
    .node-shell { display: grid; gap: 8px; }
    .node-shell.open > .template-card { border-color: var(--coral); box-shadow: 0 0 0 3px rgba(255,151,128,.07); }
    .sub-children { display: grid; gap: 10px; margin-top: 8px; padding-left: 12px; border-left: 1px solid var(--border); }
    .caret {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--blush);
      color: var(--core);
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      transition: transform .16s ease, background .16s ease, color .16s ease;
    }
    .node-shell.open > .template-card > .node-head .caret,
    .action-node.open > .action-head .caret { transform: rotate(90deg); background: var(--coral); color: var(--white); }

    .action-node { padding: 12px; display: grid; gap: 10px; }
    .action-node.level-1 { border-radius: 18px; }
    .action-head { min-height: 48px; }
    .action-title-wrap { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
    .check-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid var(--input);
      background: var(--white);
      color: transparent;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      font-size: 14px;
      transition: background .16s ease, color .16s ease, border .16s ease;
    }
    .check-btn.done { background: var(--success); border-color: var(--success); color: var(--white); }
    .action-meta { color: var(--muted); font-size: 12px; }
    .rich-editor {
      width: 100%;
      min-height: 118px;
      outline: 0;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      color: var(--core);
      font-size: 16px;
      line-height: 24px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .rich-editor:focus { border-color: var(--coral); box-shadow: 0 0 0 3px rgba(255,151,128,.1); }
    .rich-editor h3 { margin: 0 0 8px; font-weight: 500; line-height: 1.2; }
    .rich-editor ul, .rich-editor ol { padding-left: 22px; margin: 8px 0; }
    .rich-editor p { margin: 0 0 8px; }

    .action-body { display: grid; gap: 10px; }
    .action-children { display: grid; gap: 10px; padding-left: 12px; border-left: 1px solid var(--border); }

    .search-screen .topbar { margin-bottom: 8px; }
    .search-input {
      width: 100%;
      height: 50px;
      border: 1px solid var(--input);
      border-radius: 16px;
      background: var(--white);
      color: var(--core);
      padding: 0 14px;
      outline: 0;
      margin-bottom: 14px;
    }
    .search-input:focus { border-color: var(--coral); box-shadow: 0 0 0 3px rgba(255,151,128,.1); }
    .search-result { padding: 14px; display: grid; gap: 4px; text-align: left; color: var(--core); }
    .search-type { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
    .search-title { font-size: 17px; line-height: 22px; }
    .search-text { color: var(--muted); font-size: 13px; line-height: 18px; }

    .format-bar {
      position: fixed;
      left: 50%;
      bottom: calc(10px + var(--safe-bottom));
      transform: translate(-50%, 120%);
      width: min(488px, calc(100% - 24px));
      min-height: 58px;
      z-index: 60;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: var(--deep);
      opacity: 0;
      pointer-events: none;
      transition: transform .18s ease, opacity .18s ease;
    }
    .format-bar.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
    .format-btn { width: 40px; height: 40px; border-radius: 14px; background: var(--bg); color: var(--core); display: grid; place-items: center; font-size: 15px; }
    .format-btn.primary { background: var(--coral); color: var(--white); }
    .format-spacer { flex: 1; }

    .snackbar {
      position: fixed;
      left: 50%;
      bottom: calc(76px + var(--safe-bottom));
      transform: translate(-50%, 140%);
      z-index: 72;
      width: min(488px, calc(100% - 24px));
      min-height: 48px;
      padding: 8px 8px 8px 14px;
      border-radius: 18px;
      background: rgba(26,30,35,.92);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      opacity: 0;
      pointer-events: none;
      transition: transform .18s ease, opacity .18s ease;
      box-shadow: var(--deep);
      font-size: 13px;
    }
    .snackbar.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
    .snackbar button { min-height: 34px; border-radius: 999px; padding: 0 12px; background: var(--coral); color: var(--white); font-size: 13px; }

    .tools-backdrop {
      position: fixed;
      inset: 0;
      z-index: 64;
      background: rgba(26,30,35,.24);
      display: grid;
      align-items: end;
      justify-items: center;
      padding: 16px 12px calc(12px + var(--safe-bottom));
    }
    .tools-sheet {
      width: min(496px, 100%);
      padding: 16px;
      box-shadow: var(--deep);
      display: grid;
      gap: 10px;
    }
    .tool-button {
      width: 100%;
      min-height: 48px;
      border-radius: 14px;
      background: var(--bg);
      color: var(--core);
      text-align: left;
      padding: 0 14px;
      border: 1px solid var(--border);
    }
    .tool-button.danger { color: var(--danger); }
    .file-input { display: none; }

    .auth-card { width: 100%; padding: 24px; box-shadow: var(--shadow); }
    .auth-title { margin: 28px 0 6px; font-size: 42px; font-weight: 400; line-height: 1.08; }
    .auth-copy { margin: 0 0 22px; color: var(--muted); font-size: 15px; line-height: 22px; }
    .auth-form { display: grid; gap: 12px; }
    .auth-input {
      width: 100%; height: 48px; border: 1px solid var(--input); border-radius: 8px; background: var(--white); color: var(--core); padding: 0 14px; font-size: 15px; outline: 0;
    }
    .auth-input:focus { border-color: var(--coral); box-shadow: 0 0 0 3px rgba(255,151,128,.1); }
    .auth-actions { display: grid; gap: 10px; margin-top: 6px; }
    .auth-primary, .auth-secondary, .auth-ghost { width: 100%; min-height: 48px; border-radius: 999px; color: var(--white); font-size: 14px; }
    .auth-primary { background: var(--coral); }
    .auth-secondary { background: var(--core); }
    .auth-ghost { background: transparent; color: var(--core); border: 1px solid var(--border); }
    .auth-primary:disabled, .auth-secondary:disabled, .auth-ghost:disabled { opacity: .5; cursor: not-allowed; }
    .auth-message { min-height: 21px; margin-top: 14px; color: var(--muted); font-size: 14px; line-height: 21px; word-break: break-word; }

    @media (min-width: 768px) {
      body { background: #F2F0EF; }
      .phone { box-shadow: rgba(26,30,35,.12) 0px 24px 48px; }
      .screen, .editor { padding-left: 24px; padding-right: 24px; }
      .project-card { min-height: 148px; }
    }
    @media (max-width: 374px) {
      .home-title { font-size: 24px; }
      .editor-title { font-size: 32px; }
      .project-card { padding: 16px; }
      .format-btn { width: 36px; }
      .drag-handle { width: 30px; }
      .sync-pill { display: none; }
    }

    /* Planxanh dark redesign — visual-only override, app logic untouched */
    :root {
      --core: #ffffff;
      --muted: #b3b3b3;
      --bg: #121212;
      --white: #242424;
      --coral: #ffc8d2;
      --coral-2: #ffd8e1;
      --blush: rgba(255, 200, 210, 0.14);
      --border: #3e3e3e;
      --input: #3e3e3e;
      --success: #60a5fa;
      --warning: #facc15;
      --danger: #ff453a;
      --shadow: none;
      --lift: none;
      --deep: 0 18px 48px rgba(0,0,0,.45);
      color-scheme: dark;
    }

    html, body {
      background: var(--bg);
      color: var(--core);
    }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    h1, h2, h3, .brand-title, .home-title, .editor-title, .auth-title, .tab-btn {
      font-family: "Montserrat", "Inter", sans-serif;
      letter-spacing: -0.5px;
    }

    .phone {
      max-width: 640px;
      background: var(--bg);
    }

    .screen, .editor, .auth-screen, .boot-screen {
      padding-left: 20px;
      padding-right: 20px;
      background: var(--bg);
    }

    .topbar, .editorbar {
      min-height: 58px;
      margin: 0 -20px 16px;
      padding: calc(8px + var(--safe-top)) 20px 10px;
      background: linear-gradient(to bottom, rgba(18,18,18,.98), rgba(18,18,18,.92));
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .topbar::after, .editorbar::after {
      content: "";
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 0;
      height: 1px;
      background: linear-gradient(90deg, rgba(255,255,255,.02), rgba(255,255,255,.09), rgba(255,255,255,.02));
      pointer-events: none;

    function repairStableIdentity(state, options = {}) {

    function backfillActionSourcesByStablePath(state, changed) {

      boxes.forEach(box => {

        pathToBoxIds.get(path).push(box.id);

          const ids = pathToBoxIds.get(pathOf(action, day.nodes)) || [];
          if (ids.length === 1) {

          if (action.title !== nextTitle || action.sourceBoxNodeId !== sourceId || (action.archivedAt || null) !== nextArchivedAt) {

            action.sourceBoxNodeId = sourceId;

    async function ensureFreshSession() {
      let sessionResult;

        sessionResult = await withTimeout(sb.auth.getSession(), 10000);
      } catch (error) {
        throw error;
      }
      const { data, error } = sessionResult || {};
      if (error) throw error;
      if (!data?.session?.user) throw new Error("No active session");
      currentUser = data.session.user;
      const expiresAtMs = data.session.expires_at ? data.session.expires_at * 1000 : 0;
      if (expiresAtMs && expiresAtMs - Date.now() < 180000) {

        if (refreshed.error) throw refreshed.error;
        if (refreshed.data?.session?.user) currentUser = refreshed.data.session.user;
      }
      return currentUser;

    async function supabaseAuthed(fn, { optional = false } = {}) {
      try { await ensureFreshSession(); } catch (error) { return { data: null, error }; }
      let result;
      try { result = await withTimeout(fn(), optional ? 10000 : 15000); } catch (error) { return { data: null, error }; }
      if (result?.error && isAuthStaleError(result.error)) {
        try {
          const refreshed = await withTimeout(sb.auth.refreshSession(), 10000);
          if (refreshed.error) return result;
          if (refreshed.data?.session?.user) currentUser = refreshed.data.session.user;

    async function pushCloudState() {

      if (cloudSaving) { cloudPending = true; return; }
      cloudSaving = true;
      let stateError = null;
      let dayError = null;

      try {
        const userId = currentUser.id;
        const fullState = sanitizedState(db);
        const statePayload = {
          user_id: userId,
          // Full snapshot fallback: includes actionDays so data still syncs even if the per-day table is missing or temporarily unavailable.
          data: fullState,
          updated_at: now()
        };
        const stateResult = await supabaseAuthed(() => sb.from(STATE_TABLE).upsert(statePayload, { onConflict: "user_id" }));
        stateError = stateResult.error;

        const days = db.actionDays.map(day => ({
          user_id: userId,
          date: day.date,
          data: sanitizedActionDay(day),
          updated_at: now()
        }));
        if (!stateError && days.length) {
          const dayResult = await supabaseAuthed(() => sb.from(ACTION_DAYS_TABLE).upsert(days, { onConflict: "user_id,date" }), { optional: true });
          dayError = dayResult.error;
        }
      } catch (caught) {

      if (dayError && !isMissingTableError(dayError)) {

        if (isRetryableSyncError(dayError)) {
          setTimeout(() => { if (currentUser && navigator.onLine) queueCloudSave(); }, 7000);
        }
      }

      setSync("saved", "Saved");
      if (cloudPending) { cloudPending = false; queueCloudSave(); }
    }

    async function hydrateUserState() {

      const { data: stateRow, error: stateError } = await supabaseAuthed(() => sb.from(STATE_TABLE).select("data").eq("user_id", currentUser.id).maybeSingle());
      const local = loadLocalForUser(currentUser.id) || loadLegacyLocal();

      if (stateError) {
        console.error(stateError);
        db = local || seed();
        booting = false;
        render();
        setSync(isMissingTableError(stateError) ? "error" : "offline", isMissingTableError(stateError) ? "No DB" : "Local saved");
        if (isMissingTableError(stateError)) showSnack("Chưa chạy SQL", null, 2600);
        return;

      db = stateRow?.data ? normalizeState(stateRow.data) : (local || seed());
      const fallbackDays = normalizeState(stateRow?.data || {}).actionDays || [];

      const { data: dayRows, error: dayError } = await supabaseAuthed(() => sb
        .from(ACTION_DAYS_TABLE)
        .select("date,data,created_at,updated_at")
        .eq("user_id", currentUser.id)

      if (dayError) {

    }

    async function bootstrap() {
      if (!location.hash) location.hash = "/box";
      renderBoot();
      registerServiceWorker();
      const { data, error } = await sb.auth.getSession();
      if (error) console.error(error);
      if (data.session?.user) {
        currentUser = data.session.user;
        await hydrateUserState();
      } else {
        booting = false;
        renderAuth();
      }
      sb.auth.onAuthStateChange(async (event, session) => {
        if (event === "PASSWORD_RECOVERY") { authView = "updatePassword"; booting = false; renderAuth(); return; }
        if (event === "SIGNED_IN" && session?.user && session.user.id !== currentUser?.id) {
          currentUser = session.user;
          await hydrateUserState();
        }
        if (event === "SIGNED_OUT") {
          currentUser = null;
          db = seed();
          booting = false;
          authView = "login";
          authMessage = "Đã logout";
          renderAuth();
        }
      });
    }

    async function handleAuth(action) {
      if (authBusy) return;
      const email = document.getElementById("authEmail")?.value.trim();
      const password = document.getElementById("authPassword")?.value;
      if (action === "forgot") {
        if (!email) { authMessage = "Nhập email trước"; renderAuth(); return; }
        authBusy = true; authMessage = "Đang gửi email reset..."; renderAuth();
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
        authBusy = false; authMessage = error ? error.message : "Check email để reset password"; renderAuth(); return;
      }
      if (action === "update-password") {
        const next = document.getElementById("newPassword")?.value;
        if (!next || next.length < 6) { authMessage = "Password tối thiểu 6 ký tự"; renderAuth(); return; }
        authBusy = true; authMessage = "Đang đổi password..."; renderAuth();
        const { error } = await sb.auth.updateUser({ password: next });
        authBusy = false;
        if (error) { authMessage = error.message; renderAuth(); return; }
        authView = "login"; authMessage = "Đã đổi password"; renderAuth(); return;
      }
      if (!email || !password) { authMessage = "Nhập email và password"; renderAuth(); return; }
      if (password.length < 6) { authMessage = "Password tối thiểu 6 ký tự"; renderAuth(); return; }
      authBusy = true; authMessage = action === "signup" ? "Đang sign up..." : "Đang login..."; renderAuth();
      const result = action === "signup" ? await sb.auth.signUp({ email, password }) : await sb.auth.signInWithPassword({ email, password });
      authBusy = false;
      if (result.error) { authMessage = result.error.message; renderAuth(); return; }
      const session = result.data?.session || (await sb.auth.getSession()).data.session;
      if (session?.user) { currentUser = session.user; await hydrateUserState(); return; }
      authMessage = "Check email để xác nhận, rồi login lại";
      renderAuth();
    }

    async function signOut() {
      forceAuthScreen("Đã logout");
      try { await Promise.race([sb.auth.signOut({ scope: "local" }), delay(700)]); } catch {}
      try { sb.auth.signOut({ scope: "global" }).catch(() => {}); } catch {}
    }

    function route() {
      const hash = decodeURIComponent(location.hash.replace("#", "")) || "/box";
      const parts = hash.split("/").filter(Boolean);
      if (!parts.length || parts[0] === "box" && parts.length === 1) return { name: "box" };
      if (parts[0] === "box" && parts[1]) return { name: "boxEditor", rootId: parts[1] };
      if (parts[0] === "actions" && parts.length === 1) return { name: "actions" };
      if (parts[0] === "actions" && parts[1]) return { name: "actionDay", dayId: parts[1], targetId: parts[2] || null };
      if (parts[0] === "search") return { name: "search" };
      return { name: "box" };
    }
    function goBoxHome() { location.hash = "/box"; }
    function goActionsHome() { location.hash = "/actions"; }
    function openBox(rootId) { location.hash = "/box/" + encodeURIComponent(rootId); }
    function openActionDay(dayId, nodeId = "") { const day = getDay(dayId); if (day) db.ui.selectedActionDate = day.date; location.hash = "/actions/" + encodeURIComponent(dayId) + (nodeId ? "/" + encodeURIComponent(nodeId) : ""); }
    function openSearch() {
      if (route().name === "box") {
        boxSearchOpen = true;
        toolsOpen = false;
        render();
        setTimeout(() => document.querySelector("[data-box-search-input]")?.focus(), 40);
        return;
      }
      location.hash = "/search";
    }

    function nodesForDay(dayId) { return getDay(dayId)?.nodes || []; }
    function getDay(dayId) { return db.actionDays.find(day => day.id === dayId); }
    function getDayByDate(date) { return db.actionDays.find(day => day.date === date); }
    function getBoxNode(id) { return db.boxNodes.find(n => n.id === id); }
    function getActionNode(dayId, nodeId) { return nodesForDay(dayId).find(n => n.id === nodeId); }
    function childrenOf(parentId, nodes) { return nodes.filter(n => (n.parentId ?? null) === (parentId ?? null)).sort((a, b) => (a.sort || 0) - (b.sort || 0)); }
    function allBoxRoots() { return childrenOf(null, db.boxNodes); }
    function boxRoots() { return allBoxRoots().filter(node => !boxIsInactive(node)); }
    function currentBoxView() {
      const value = db?.ui?.boxView || "active";
      return ["active", "archived", "done"].includes(value) ? value : "active";
    }
    function subtreeHasBoxStatus(id, status) {
      const ids = new Set([id, ...descendantsOf(id, db.boxNodes).map(n => n.id)]);
      return db.boxNodes.some(n => ids.has(n.id) && (status === "done" ? boxIsDone(n) : boxIsArchived(n)));
    }
    function vaultRoots(mode = currentBoxView()) {
      if (mode === "archived") return allBoxRoots().filter(root => subtreeHasBoxStatus(root.id, "archived"));
      if (mode === "done") return allBoxRoots().filter(root => subtreeHasBoxStatus(root.id, "done"));
      return boxRoots();
    }
    function nodeMatchesBoxView(node, mode = currentBoxView()) {
      if (!node) return false;
      if (mode === "archived") return boxIsArchived(node) || descendantsOf(node.id, db.boxNodes).some(boxIsArchived);
      if (mode === "done") return boxIsDone(node) || descendantsOf(node.id, db.boxNodes).some(boxIsDone);
      return !boxIsInactive(node);
    }
    function childrenForBoxView(parentId, mode = currentBoxView()) {
      return childrenOf(parentId, db.boxNodes).filter(child => nodeMatchesBoxView(child, mode));
    }
    function descendantsOf(id, nodes) {
      const out = [];
      function walk(nodeId) { childrenOf(nodeId, nodes).forEach(child => { out.push(child); walk(child.id); }); }
      walk(id); return out;
    }
    function ancestorsOf(id, nodes) {
      const out = [];
      let cur = nodes.find(n => n.id === id);
      while (cur?.parentId) { cur = nodes.find(n => n.id === cur.parentId); if (cur) out.unshift(cur); }
      return out;
    }
    function rootOf(node, nodes) { let cur = node; while (cur?.parentId) cur = nodes.find(n => n.id === cur.parentId); return cur; }
    function pathOf(node, nodes) { return [...ancestorsOf(node.id, nodes), node].map(n => n.title).join(" › "); }

    function escapeHtml(value) {
      return String(value ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
    }
    function htmlToText(html) { const div = document.createElement("div"); div.innerHTML = sanitizeHtml(html || ""); return (div.textContent || "").replace(/\s+/g, " ").trim(); }
    function contentOf(node) { return sanitizeHtml(node.contentHtml || ""); }
    function todayYMD() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
    function displayDate(ymd) {
      const [y, m, d] = String(ymd || "").split("-");
      const label = y && m && d ? `${d}/${m}/${y}` : String(ymd || "");
      return ymd === todayYMD() ? `${label} (today)` : label;
    }
    function daysBetween(ymd, base = todayYMD()) { return Math.round((new Date(base + "T00:00:00") - new Date(ymd + "T00:00:00")) / 86400000); }

    function sanitizeHtml(input) {
      const allowed = new Set(["B", "STRONG", "I", "EM", "U", "S", "STRIKE", "DEL", "BR", "DIV", "P", "UL", "OL", "LI", "H2", "H3", "BLOCKQUOTE"]);
      const template = document.createElement("template");
      template.innerHTML = String(input || "");
      function clean(node) {
        [...node.childNodes].forEach(child => {
          if (child.nodeType === Node.ELEMENT_NODE) {
            if (!allowed.has(child.tagName)) {
              const text = document.createTextNode(child.textContent || "");
              child.replaceWith(text);
              return;
            }
            [...child.attributes].forEach(attr => child.removeAttribute(attr.name));
            clean(child);
          } else if (child.nodeType !== Node.TEXT_NODE) child.remove();
        });
      }
      clean(template.content);
      return template.innerHTML;
    }

    function render() {

          ${renderTools()}

    function renderBoxSearchPanel() {
      if (!boxSearchOpen) return "";
      return `<div class="box-search-wrap" data-box-search-wrap>
        <div class="box-search-card">
          <div class="box-search-line">
            <span class="box-search-icon">⌕</span>
            <input class="box-search-input" type="search" placeholder="Search boxes, actions, notes..." value="${escapeHtml(boxSearchQuery)}" data-box-search-input />
            <button class="box-search-close" type="button" data-close-box-search aria-label="Close search">×</button>
          </div>
          <div class="box-search-results" id="boxSearchResults">${renderBoxSearchResults(boxSearchQuery)}</div>
        </div>
      </div>`;
    }

    function renderBoxSearchResults(q) {
      const term = String(q || "").trim().toLowerCase();
      if (!term) return `<div class="box-search-empty">Type to filter.</div>`;
      const out = [];
      db.boxNodes.forEach(n => {
        const noteText = n.level === 1 ? htmlToText(n.boxNoteHtml || "") : "";
        if (n.title.toLowerCase().includes(term) || noteText.toLowerCase().includes(term)) out.push({ type: "Box", title: pathOf(n, db.boxNodes), text: noteText || "Structure", action: `data-open-box="${rootOf(n, db.boxNodes).id}"` });
      });
      db.actionDays.forEach(day => (day.nodes || []).forEach(n => {
        entriesFor(n).forEach(entry => {
          const text = entryText(entry);
          if (n.title.toLowerCase().includes(term) || text.toLowerCase().includes(term)) {
            out.push({ type: `${displayDate(day.date)} · ${entry.type}`, title: pathOf(n, day.nodes), text, action: `data-open-action-day="${day.id}" data-open-action-node="${n.id}" ${entry.type === "note" ? `data-open-note-entry="${entry.id}" data-day-id="${day.id}" data-node-id="${n.id}"` : ""}` });
          }
        });
      }));
      if (!out.length) return `<div class="box-search-empty">No results.</div>`;
      return out.slice(0, 30).map(item => `<button class="box-search-result" type="button" ${item.action}><span>${escapeHtml(item.type)}</span><strong>${escapeHtml(item.title)}</strong>${item.text ? `<em>${escapeHtml(item.text)}</em>` : ""}</button>`).join("");
    }

    function renderBoxFilters() {
      const f = db.ui.boxFilter || "today";
      const rangeLabel = db.ui.boxFilterFrom || db.ui.boxFilterTo
        ? `${db.ui.boxFilterFrom ? displayDate(db.ui.boxFilterFrom) : "..."} → ${db.ui.boxFilterTo ? displayDate(db.ui.boxFilterTo) : "..."}`

      return `
        <div class="box-filter-area">
          <div class="filters">
            ${filterChip("box-filter", "today", "Today", f === "today")}
            ${filterChip("box-filter", "7", "7 days", f === "7")}

            ${filterChip("box-filter", "all", "All", f === "all")}

          </div>
          ${db.ui.boxDateRangeOpen ? renderBoxDateRangePanel() : ""}
