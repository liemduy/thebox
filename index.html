        <button type="button" data-apply-box-date-range>Apply</button>
      </div>`;
    }

    function renderBoxVaultTabs() {
      const view = currentBoxView();
      const archivedCount = db.boxNodes.filter(boxIsArchived).length;
      const doneCount = db.boxNodes.filter(boxIsDone).length;
      return `<div class="vault-tabs" aria-label="Box vaults">
        <button class="vault-tab ${view === "active" ? "active" : ""}" type="button" data-box-view="active">Active</button>
        <button class="vault-tab ${view === "archived" ? "active" : ""}" type="button" data-box-view="archived">Archived <span class="vault-count">${archivedCount}</span></button>
        <button class="vault-tab ${view === "done" ? "active" : ""}" type="button" data-box-view="done">Done <span class="vault-count">${doneCount}</span></button>
      </div>`;
    }

    function filterChip(kind, value, label, active) {
      return `<button class="chip ${active ? "active" : ""}" type="button" data-filter-kind="${kind}" data-filter-value="${value}">${label}</button>`;
    }

    function boxNoteContent(node) {
      return sanitizeHtml(node?.boxNoteHtml || "");
    }

    function boxHasNote(node) {
      return Boolean(htmlToText(boxNoteContent(node)));
    }

    function boxIsArchived(node) {
      return Boolean(node?.archivedAt || node?.archived);
    }

    function boxIsDone(node) {
      return Boolean(node?.doneAt || node?.done);
    }

    function boxIsInactive(node) {
      return boxIsArchived(node) || boxIsDone(node);
    }

    function statusBadge(node) {
      if (boxIsDone(node)) return `<span class="status-badge done" contenteditable="false">done</span>`;
      if (boxIsArchived(node)) return `<span class="status-badge archived archive-badge" contenteditable="false">archived</span>`;
      return "";
    }

    function archiveBadge(node) {
      return statusBadge(node);
    }

    function subtreeBoxIds(id) {
      return [id, ...descendantsOf(id, db.boxNodes).map(n => n.id)];
    }

    function boxSubtreeHasStoredData(id) {
      const ids = new Set(subtreeBoxIds(id));
      if (db.boxNodes.some(n => ids.has(n.id) && htmlToText(n.boxNoteHtml || ""))) return true;
      return (db.actionDays || []).some(day => (day.nodes || []).some(n => ids.has(n.sourceBoxNodeId || n.templateId || n.boxNodeId) && entriesFor(n).length > 0));
    }

    function actionDayHasEntriesForBoxSubtree(day, boxId) {
      const ids = new Set(subtreeBoxIds(boxId));
      return (day?.nodes || []).some(n => ids.has(n.sourceBoxNodeId || n.templateId || n.boxNodeId) && entriesFor(n).length > 0);
    }

    function renderBoxNotePill(node, context = "boxes") {
      if (!node || node.level !== 1) return "";
      return `<button class="box-note-pill ${boxHasNote(node) ? "has-note" : ""}" type="button" data-toggle-box-note="${node.id}" data-note-context="${context}" aria-label="Box notes">notes</button>`;
    }

    function renderBoxNotePanel(node, context = "boxes") {
      return "";
    }

    function projectCard(node, mode = currentBoxView()) {
      const inactive = boxIsInactive(node);
      const canEdit = mode === "active" && !inactive;
      const canRestore = (mode === "archived" && boxIsArchived(node)) || (mode === "done" && boxIsDone(node));
      const contextOnly = mode !== "active" && !canRestore;
      return `
        <article class="project-card${createdFlashId === node.id ? " just-created" : ""}${boxIsArchived(node) ? " is-archived" : ""}${boxIsDone(node) ? " is-done" : ""}${mode !== "active" ? " vault-card" : ""}" data-root-card="${node.id}">
          <div class="project-head">
            <div class="project-left">
              ${mode === "active" ? `<button class="drag-handle" type="button" data-drag-handle aria-label="Kéo sắp xếp">☰</button>` : `<span class="drag-handle" aria-hidden="true">☰</span>`}
              <div class="title-stack">
                <div class="editable-title home-title" ${canEdit ? `contenteditable="true"` : `contenteditable="false"`} spellcheck="false" data-box-title="${node.id}" data-placeholder="Tên box">${escapeHtml(node.title)}</div>
                ${statusBadge(node)}
                ${contextOnly ? `<div class="vault-path-note">contains ${mode === "archived" ? "archived" : "done"} items</div>` : ""}
              </div>
            </div>
            <div class="inline-actions">
              ${canEdit ? renderBoxNotePill(node, "boxes") : ""}
              ${canEdit && node.level < 5 ? `<button class="round-btn primary small-icon" type="button" data-add-box-child="${node.id}" aria-label="Thêm sub">+</button>` : ""}
              ${canEdit ? `<button class="round-btn success small-icon" type="button" data-done-box-node="${node.id}" aria-label="Move to Done">✓</button>` : ""}
              ${canEdit ? `<button class="round-btn danger small-icon" type="button" data-delete-box-node="${node.id}" aria-label="Archive or delete box">×</button>` : ""}
              ${canRestore ? `<button class="round-btn restore small-icon" type="button" data-restore-box-node="${node.id}" data-restore-status="${mode}" aria-label="Restore box">↩</button>` : ""}
            </div>
          </div>
          ${canEdit ? renderBoxNotePanel(node, "boxes") : ""}
          ${renderMiniTree(node.id, mode)}
        </article>`;
    }

    function renderMiniTree(rootId, mode = currentBoxView()) {
      const kids = childrenForBoxView(rootId, mode);
      if (!kids.length) return "";
      return `<div class="box-subtree">${kids.map(child => renderMiniRow(child, 0, mode)).join("")}</div>`;
    }

    function renderMiniRow(node, depth, mode = currentBoxView()) {
      const kids = childrenForBoxView(node.id, mode);
      const open = (db.ui.expandedBoxNodes || []).includes(node.id);
      const flash = createdFlashId === node.id ? " just-created" : "";
      const inactive = boxIsInactive(node);
      const canEdit = mode === "active" && !inactive;
      const canRestore = (mode === "archived" && boxIsArchived(node)) || (mode === "done" && boxIsDone(node));
      return `
        <div class="box-subrow depth-${depth} ${open ? "open" : ""}${flash}${boxIsArchived(node) ? " is-archived" : ""}${boxIsDone(node) ? " is-done" : ""}" style="--depth:${depth}" data-mini-box-row="${node.id}">
          <div class="box-subhead" data-toggle-box-node="${node.id}">
            <div class="box-subleft">
              <span class="caret">›</span>
              <span class="title-stack"><span class="editable-title box-subtitle" ${canEdit ? `contenteditable="true"` : `contenteditable="false"`} spellcheck="false" data-box-title="${node.id}" data-placeholder="Tên sub">${escapeHtml(node.title)}</span>${statusBadge(node)}</span>
            </div>
            <div class="box-subactions">
              ${canEdit && node.level < 5 ? `<button class="mini-icon add" type="button" data-add-box-child="${node.id}" aria-label="Thêm sub">+</button>` : ""}
              ${canEdit ? `<button class="mini-icon done" type="button" data-done-box-node="${node.id}" aria-label="Move to Done">✓</button>` : ""}
              ${canEdit ? `<button class="mini-icon delete" type="button" data-delete-box-node="${node.id}" aria-label="Archive or delete sub">×</button>` : ""}
              ${canRestore ? `<button class="mini-icon restore" type="button" data-restore-box-node="${node.id}" data-restore-status="${mode}" aria-label="Restore sub">↩</button>` : ""}
            </div>
          </div>
          ${renderNodeSummary(node)}
          ${open && kids.length ? `<div class="box-subchildren">${kids.map(child => renderMiniRow(child, depth + 1, mode)).join("")}</div>` : ""}
        </div>`;
    }

    function renderProjectSummary(root) {
      return "";
    }

    function renderNodeSummary(boxNode) {
      const days = filteredDaysForBox();
      const blocks = days.map(day => renderNodeSummaryForDay(boxNode, day)).filter(Boolean).join("");
      if (!blocks) return "";
      return `<div class="node-date-summary">${blocks}</div>`;
    }

    function renderNodeSummaryForDay(boxNode, day) {
      const actionNode = (day.nodes || []).find(n => (n.sourceBoxNodeId || n.templateId || n.boxNodeId) === boxNode.id);
      if (!actionNode) return "";
      const entries = entriesFor(actionNode);
      if (!entries.length) return "";
      const key = `${boxNode.id}:${day.id}`;
      const expanded = (db.ui.expandedSummaryDays || []).includes(key);
      return `
        <section class="summary-day compact-summary node-summary-day ${expanded ? "" : "collapsed"}">
          <button class="summary-head node-summary-head" type="button" data-toggle-summary="${key}">
            <span class="summary-date-label">${displayDate(day.date)}</span>
            <span class="chev">⌄</span>
          </button>
          ${expanded ? `<div class="summary-body node-summary-body"><div class="summary-tree node-summary-tree">${entries.map(entry => renderNodeSummaryEntry(day, actionNode, entry)).join("")}</div></div>` : ""}
        </section>`;
    }

    function renderNodeSummaryEntry(day, node, entry) {
      const isNote = entry.type === "note";
      const label = isNote ? noteTitle(entry) : cleanTitle(entry.text || "Action");
      return `
        <button class="summary-tree-row node-summary-entry ${isNote ? "is-note" : "is-action"}" type="button" data-open-action-day="${day.id}" data-open-action-node="${node.id}">
          <span class="summary-tree-main">
            ${isNote ? `<span class="summary-note-mark">note</span>` : `<span class="summary-check ${entry.done ? "done" : ""}">✓</span>`}
            <span class="summary-tree-entry">${escapeHtml(label)}</span>
          </span>
        </button>`;
    }

    function filteredDaysForBox() {
      const f = db.ui.boxFilter || "today";
      return [...db.actionDays].sort((a, b) => b.date.localeCompare(a.date)).filter(day => {
        const diff = daysBetween(day.date);
        if (f === "today") return day.date === todayYMD();
        if (f === "7") return diff >= 0 && diff < 7;
        if (f === "30") return diff >= 0 && diff < 30;
        if (f === "custom") {
          const from = db.ui.boxFilterFrom || "0000-01-01";
          const to = db.ui.boxFilterTo || "9999-12-31";
          return day.date >= from && day.date <= to;
        }
        return true;
      });
    }

    function renderSummaryForDay(root, day) {
      const rootAction = day.nodes.find(n => (n.sourceBoxNodeId || n.templateId) === root.id && n.parentId === null);
      if (!rootAction) return "";
      const rows = summaryRowsForRoot(rootAction, day.nodes);
      if (!rows.length) return "";
      const key = `${root.id}:${day.id}`;
      const expanded = (db.ui.expandedSummaryDays || []).includes(key);
      const progress = progressForRoot(rootAction, day.nodes);
      return `
        <section class="summary-day compact-summary ${expanded ? "" : "collapsed"}">
          <button class="summary-head" type="button" data-toggle-summary="${key}">
            <span class="summary-date-label">${displayDate(day.date)} <span class="day-meta">· ${progress.done}/${progress.total}</span></span>
            <span class="chev">⌄</span>
          </button>
          ${expanded ? `<div class="summary-body"><div class="summary-tree">${rows.map(row => renderSummaryAction(day, row.node, row.entry, rootAction.level)).join("")}</div></div>` : ""}
        </section>`;
    }

    function summaryRowsForRoot(rootAction, nodes) {
      const all = [rootAction, ...descendantsOf(rootAction.id, nodes)];
      return all.flatMap(node => entriesFor(node).map(entry => ({ node, entry })));
    }

    function renderSummaryAction(day, node, entry, rootLevel = 1) {
      const isNote = entry.type === "note";
      const text = isNote ? htmlToText(entry.bodyHtml) : entry.text;
      const depth = Math.max(0, (node.level || 1) - rootLevel);
      const title = isNote ? (entry.title || "Note") : (entry.text || "Action");
      return `
        <button class="summary-tree-row ${isNote ? "is-note" : "is-action"}" style="--depth:${depth}" type="button" data-open-action-day="${day.id}" data-open-action-node="${node.id}" ${isNote ? `data-open-note-entry="${entry.id}" data-day-id="${day.id}" data-node-id="${node.id}"` : ""}>
          <span class="summary-tree-main">
            ${isNote ? `<span class="summary-note-mark">note</span>` : `<span class="summary-check ${entry.done ? "done" : ""}">✓</span>`}
            <span class="summary-tree-title">${escapeHtml(node.title)}</span>
            <span class="summary-tree-entry">${escapeHtml(title)}</span>
          </span>
          ${text && isNote ? `<span class="summary-tree-preview">${escapeHtml(text)}</span>` : ""}
        </button>`;
    }

    function progressForRoot(root, nodes) {
      const all = [root, ...descendantsOf(root.id, nodes)];
      const actions = all.flatMap(n => actionEntriesFor(n));
      return { total: actions.length, done: actions.filter(e => e.done).length };
    }

    function renderActionsHome() {
      const selectedDate = db.ui.selectedActionDate || todayYMD();
      syncSelectedActionDayWithBox(selectedDate);
      const selectedDay = getDayByDate(selectedDate);
      const progress = selectedDay ? progressForDay(selectedDay) : null;
      const roots = selectedDay ? childrenOf(null, selectedDay.nodes).filter(root => hasVisibleAction(root, selectedDay.nodes)) : [];
      app.innerHTML = `
        <section class="screen actions-workspace">
          ${renderHeader("actions")}
          <div class="action-date-bar action-date-stepper">
            <button class="date-step-btn" type="button" data-shift-action-date="-1" aria-label="Previous day">‹</button>
            <button class="date-pill" type="button" data-trigger-date-picker>
              <span>📅</span>
              <strong>${escapeHtml(displayDate(selectedDate))}</strong>
              ${progress ? `<em>${progress.done}/${progress.total}</em>` : `<em>No record</em>`}
            </button>
            <button class="date-step-btn" type="button" data-shift-action-date="1" aria-label="Next day">›</button>
            <input class="native-date" type="date" value="${escapeHtml(selectedDate)}" data-action-date-picker aria-label="Chọn ngày" />
          </div>
          ${selectedDay ? `
            <div class="filters">
              ${filterChip("action-filter", "all", "All", (db.ui.actionFilter || "all") === "all")}
              ${filterChip("action-filter", "undone", "Undone", db.ui.actionFilter === "undone")}
              ${filterChip("action-filter", "done", "Done", db.ui.actionFilter === "done")}
              ${filterChip("action-filter", "notes", "Notes", db.ui.actionFilter === "notes")}
            </div>
            <div class="action-tree">
              ${roots.length ? roots.map(root => renderActionNode(selectedDay, root)).join("") : `<div class="empty-card">No items</div>`}
            </div>
          ` : `
            ${renderActionEmptyState(selectedDate)}
          `}
          ${renderTools()}
          ${renderEntryModal()}
        </section>`;
    }

    function renderActionEmptyState(selectedDate) {
      const isToday = selectedDate === todayYMD();
      const label = isToday ? "Create today actions" : `Create actions for ${displayDate(selectedDate)}`;
      return `
        <section class="schedule-empty-state action-empty-state">
          <div class="calendar-illustration" aria-hidden="true">
            <div class="calendar-rings"><span></span><span></span></div>
            <div class="calendar-page">
              <div class="calendar-grid">
                <span></span><span></span><span></span>
                <span></span><b></b><span></span>
                <span></span><span></span><span></span>
              </div>
            </div>
          </div>
          <h2>No actions yet</h2>
          <button class="create-today empty-create-btn" type="button" data-create-actions-for-date="${escapeHtml(selectedDate)}">${escapeHtml(label)}</button>
        </section>`;
    }

    function progressForDay(day) {
      const actions = (day.nodes || []).flatMap(n => actionEntriesFor(n));
      return { total: actions.length, done: actions.filter(e => e.done).length };
    }

    function renderBoxEditor(rootId) {
      const root = getBoxNode(rootId);
      if (!root) return goBoxHome();
      const kids = childrenOf(root.id, db.boxNodes);
      app.innerHTML = `
        <section class="editor">
          <div class="editorbar">
            <button class="icon-btn" type="button" data-back-home="box" aria-label="Back">‹</button>
            <div class="editor-kicker">Box structure</div>
            <span class="sync-pill ${syncStatus}" data-sync-pill>${escapeHtml(syncIconForStatus(syncStatus))}</span>
          </div>
          <div class="project-head" style="margin-bottom:14px">
            <div class="title-stack"><div class="editable-title editor-title" contenteditable="true" spellcheck="false" data-box-title="${root.id}" data-placeholder="Tên box">${escapeHtml(root.title)}</div>${archiveBadge(root)}</div>
            <div class="inline-actions">
              ${!boxIsInactive(root) ? renderBoxNotePill(root, "boxes") : ""}
              ${!boxIsInactive(root) && root.level < 5 ? `<button class="round-btn primary" type="button" data-add-box-child="${root.id}">+</button>` : ""}
              ${!boxIsInactive(root) ? `<button class="round-btn success" type="button" data-done-box-node="${root.id}">✓</button>` : ""}
              ${!boxIsInactive(root) ? `<button class="round-btn danger" type="button" data-delete-box-node="${root.id}">×</button>` : `<button class="round-btn restore" type="button" data-restore-box-node="${root.id}">↩</button>`}
            </div>
          </div>
          ${renderBoxNotePanel(root, "boxes")}
          <div class="box-editor-tree">
            ${kids.length ? kids.map(child => renderBoxNode(child)).join("") : ``}
          </div>
        </section>`;
    }

    function renderBoxNode(node) {
      const open = (db.ui.expandedBoxNodes || []).includes(node.id);
      const kids = childrenOf(node.id, db.boxNodes);
      return `
        <div class="node-shell ${open ? "open" : ""}${boxIsArchived(node) ? " is-archived" : ""}" data-box-node-shell="${node.id}">
          <div class="template-card">
            <div class="node-head" data-toggle-box-node="${node.id}">
              <span class="caret">›</span>
              <div class="title-stack"><div class="editable-title sub-title" contenteditable="true" spellcheck="false" data-box-title="${node.id}" data-placeholder="Tên sub">${escapeHtml(node.title)}</div>${archiveBadge(node)}</div>
              <div class="inline-actions">
                ${!boxIsInactive(node) && node.level < 5 ? `<button class="round-btn primary small-icon" type="button" data-add-box-child="${node.id}">+</button>` : ""}
                ${!boxIsInactive(node) ? `<button class="round-btn success small-icon" type="button" data-done-box-node="${node.id}">✓</button>` : ""}
                ${!boxIsInactive(node) ? `<button class="round-btn danger small-icon" type="button" data-delete-box-node="${node.id}">×</button>` : `<button class="round-btn restore small-icon" type="button" data-restore-box-node="${node.id}">↩</button>`}
              </div>
            </div>
            ${open && kids.length ? `<div class="sub-children">${kids.map(child => renderBoxNode(child)).join("")}</div>` : ""}
          </div>
        </div>`;
    }

    function renderActionDayEditor(dayId, targetId = null) {
      const day = getDay(dayId);
      if (!day) return goActionsHome();
      const changed = syncActionDayWithBox(day);
      if (changed) { cacheLocal(); if (navigator.onLine) queueCloudSave(); }
      if (targetId) expandActionAncestors(day, targetId);
      const roots = childrenOf(null, day.nodes).filter(root => hasVisibleAction(root, day.nodes));
      const progress = progressForDay(day);
      app.innerHTML = `
        <section class="editor">
          <div class="editorbar">
            <button class="icon-btn" type="button" data-back-home="actions" aria-label="Back">‹</button>
            <div class="editor-kicker">${displayDate(day.date)} · ${progress.done}/${progress.total}</div>
            <span class="sync-pill ${syncStatus}" data-sync-pill>${escapeHtml(syncIconForStatus(syncStatus))}</span>
          </div>
          <div class="filters">
            ${filterChip("action-filter", "all", "All", (db.ui.actionFilter || "all") === "all")}
            ${filterChip("action-filter", "undone", "Undone", db.ui.actionFilter === "undone")}
            ${filterChip("action-filter", "done", "Done", db.ui.actionFilter === "done")}
              ${filterChip("action-filter", "notes", "Notes", db.ui.actionFilter === "notes")}
          </div>
          <div class="action-tree">
            ${roots.length ? roots.map(root => renderActionNode(day, root)).join("") : `<div class="empty-card">No items</div>`}
          </div>
          ${renderEntryModal()}
        </section>`;
      if (targetId) setTimeout(() => document.querySelector(`[data-action-node-id="${CSS.escape(targetId)}"]`)?.scrollIntoView({ behavior: "smooth", block: "center" }), 80);
    }

    function expandActionAncestors(day, nodeId) {
      const collapsed = new Set(db.ui.collapsedActionNodes || []);
      [...ancestorsOf(nodeId, day.nodes).map(n => n.id), nodeId].forEach(id => collapsed.delete(id));
      db.ui.collapsedActionNodes = [...collapsed];
    }

    function visibleEntriesFor(node) {
      const filter = db.ui.actionFilter || "all";
      const entries = entriesFor(node);
      if (filter === "undone") return entries.filter(e => e.type === "action" && !e.done);
      if (filter === "done") return entries.filter(e => e.type === "action" && e.done);
      if (filter === "notes") return entries.filter(e => e.type === "note");
      return entries;
    }

    function hasVisibleAction(node, nodes) {
      const filter = db.ui.actionFilter || "all";
      const self = filter === "all" ? true : visibleEntriesFor(node).length > 0;
      return Boolean(self) || childrenOf(node.id, nodes).some(child => hasVisibleAction(child, nodes));
    }

    function renderActionNode(day, node) {
      if (!hasVisibleAction(node, day.nodes)) return "";
      const open = !(db.ui.collapsedActionNodes || []).includes(node.id);
      const kids = childrenOf(node.id, day.nodes).filter(child => hasVisibleAction(child, day.nodes));
      const entryCount = entriesFor(node).length;
      const sourceBox = getBoxNode(node.sourceBoxNodeId || node.templateId || node.boxNodeId);
      const canAddEntry = node.level > 1 && !boxIsInactive(sourceBox);
      return `
        <section class="action-node level-${node.level} ${open ? "open" : ""}${boxIsArchived(sourceBox) ? " is-archived" : ""}${boxIsDone(sourceBox) ? " is-done" : ""}" data-action-node-id="${node.id}">
          <div class="action-head" data-toggle-action-node="${node.id}">
            <div class="action-title-wrap">
              <span class="caret">›</span>
              <div class="title-stack"><div class="action-title">${escapeHtml(node.title)}</div>${archiveBadge(sourceBox)}</div>
            </div>
            <div class="action-head-actions">
              ${sourceBox ? renderBoxNotePill(sourceBox, "actions") : ""}
              ${canAddEntry ? `<div class="action-menu-wrap">
                <button class="action-add-btn" type="button" data-open-entry-menu="${node.id}" data-day-id="${day.id}" aria-label="Add action or note">+</button>
                ${actionMenuOpenFor === `${day.id}:${node.id}` ? `<div class="action-menu" data-entry-menu>
                  <button type="button" data-new-action-entry="${node.id}" data-day-id="${day.id}">Action</button>
                  <button type="button" data-new-note-entry="${node.id}" data-day-id="${day.id}">Notes</button>
                </div>` : ""}
              </div>` : ""}
            </div>
          </div>
          ${open ? `<div class="action-body">
            ${sourceBox ? renderBoxNotePanel(sourceBox, "actions") : ""}
            ${canAddEntry ? renderEntryList(day, node) : ""}
            ${kids.length ? `<div class="action-children">${kids.map(child => renderActionNode(day, child)).join("")}</div>` : ""}
          </div>` : (entryCount && canAddEntry ? `<div class="action-meta">${entryCount} item${entryCount > 1 ? "s" : ""}</div>` : "")}
        </section>`;
    }

    function renderEntryList(day, node) {
      const entries = visibleEntriesFor(node);
      if (!entries.length) return `<div class="entry-empty">No actions or notes yet.</div>`;
      return `<div class="entry-list">${entries.map(entry => renderEntryRow(day, node, entry)).join("")}</div>`;
    }

    function renderEntryRow(day, node, entry) {
      if (entry.type === "note") {
        return `<div class="entry-row note-row" data-entry-id="${entry.id}">
          <button class="entry-text note-title-inline" type="button" data-open-note-entry="${entry.id}" data-day-id="${day.id}" data-node-id="${node.id}">${escapeHtml(noteTitle(entry))}</button>
          <span class="entry-actions">
            <button class="entry-edit-btn" type="button" data-open-note-entry="${entry.id}" data-day-id="${day.id}" data-node-id="${node.id}" aria-label="Edit note">✎</button>
            <button class="entry-delete-btn" type="button" data-delete-entry="${entry.id}" data-day-id="${day.id}" data-node-id="${node.id}" aria-label="Delete note">×</button>
          </span>
        </div>`;
      }
      return `<div class="entry-row ${entry.done ? "done" : ""}" data-entry-id="${entry.id}">
        <input class="entry-check" type="checkbox" ${entry.done ? "checked" : ""} data-toggle-entry-done="${entry.id}" data-day-id="${day.id}" data-node-id="${node.id}" />
        <span class="entry-text" contenteditable="true" spellcheck="true" data-entry-action-text="${entry.id}" data-day-id="${day.id}" data-node-id="${node.id}">${escapeHtml(entry.text || "Action")}</span>
        <span class="entry-actions"><button class="entry-delete-btn" type="button" data-delete-entry="${entry.id}" data-day-id="${day.id}" data-node-id="${node.id}" aria-label="Delete action">×</button></span>
      </div>`;
    }

    function renderEntryModal() {
      if (!entryModal) return "";
      if (entryModal.type === "boxNote") {
        const node = getBoxNode(entryModal.boxId);
        if (!node) return "";
        return `<div class="modal-backdrop" data-close-entry-modal>
          <div class="entry-modal box-note-modal" data-entry-modal-card>
            <h3>Box notes</h3>
            <p class="modal-subtitle">${escapeHtml(node.title || "Untitled")}</p>
            <label>Notes<div class="rich-editor note-rich-editor box-note-modal-editor" contenteditable="true" spellcheck="true" data-box-note-modal-editor="${node.id}" data-placeholder="Nhập notes cho box này...">${boxNoteContent(node)}</div></label>
            <div class="entry-modal-actions">
              <button class="modal-btn" type="button" data-close-entry-modal>Cancel</button>
              <button class="modal-btn primary" type="button" data-save-box-note-modal>Done</button>
            </div>
          </div>
        </div>`;
      }
      if (entryModal.type === "action") {
        return `<div class="modal-backdrop" data-close-entry-modal>
          <div class="entry-modal" data-entry-modal-card>
            <h3>Add actions</h3>
            <label>Each line is one action<textarea data-action-lines placeholder="Write one action per line\nFollow up client\nDesign new layout"></textarea></label>
            <div class="entry-modal-actions">
              <button class="modal-btn" type="button" data-close-entry-modal>Cancel</button>
              <button class="modal-btn primary" type="button" data-save-action-lines>Done</button>
            </div>
          </div>
        </div>`;
      }
      const note = entryModal.entry || { title: "", bodyHtml: "" };
      return `<div class="modal-backdrop" data-close-entry-modal>
        <div class="entry-modal" data-entry-modal-card>
          <h3>${entryModal.entryId ? "Edit note" : "New note"}</h3>
          <label>Note title<input data-note-title-input value="${escapeHtml(note.title || "")}" placeholder="Tên note" /></label>
          <label>Notes<div class="rich-editor note-rich-editor" contenteditable="true" spellcheck="true" data-note-body-editor data-placeholder="Nhập notes...">${sanitizeHtml(note.bodyHtml || "")}</div></label>
          <div class="entry-modal-actions">
            <button class="modal-btn" type="button" data-close-entry-modal>Cancel</button>
            <button class="modal-btn primary" type="button" data-save-note-entry>Done</button>
          </div>
        </div>
      </div>`;
    }

    function renderSearch() {
      app.innerHTML = `
        <section class="screen search-screen">
          <div class="topbar">
            <button class="icon-btn" type="button" data-back-smart aria-label="Back">‹</button>
            <div class="brand"><span class="brand-title">Search</span></div>
            <span class="sync-pill ${syncStatus}" data-sync-pill>${escapeHtml(syncIconForStatus(syncStatus))}</span>
          </div>
          <input class="search-input" type="search" placeholder="Tìm box, action, nội dung..." value="${escapeHtml(searchQuery)}" data-search-input autofocus />
          <div class="search-results" id="searchResults">${renderSearchResults(searchQuery)}</div>
        </section>`;
      setTimeout(() => document.querySelector("[data-search-input]")?.focus(), 30);
    }

    function renderSearchResults(q) {
      const term = String(q || "").trim().toLowerCase();
      if (!term) return `<div class="section-label">Nhập từ khóa để tìm.</div>`;
      const out = [];
      db.boxNodes.forEach(n => {
        const noteText = n.level === 1 ? htmlToText(n.boxNoteHtml || "") : "";
        if (n.title.toLowerCase().includes(term) || noteText.toLowerCase().includes(term)) out.push({ type: "Box", title: pathOf(n, db.boxNodes), text: noteText || "Structure", action: `data-open-box="${rootOf(n, db.boxNodes).id}"` });
      });
      db.actionDays.forEach(day => day.nodes.forEach(n => {
        entriesFor(n).forEach(entry => {
          const text = entryText(entry);
          if (n.title.toLowerCase().includes(term) || text.toLowerCase().includes(term)) {
            out.push({ type: `${displayDate(day.date)} · ${entry.type}`, title: pathOf(n, day.nodes), text, action: `data-open-action-day="${day.id}" data-open-action-node="${n.id}" ${entry.type === "note" ? `data-open-note-entry="${entry.id}" data-day-id="${day.id}" data-node-id="${n.id}"` : ""}` });
          }
        });
      }));
      if (!out.length) return `<div class="section-label">Không có kết quả.</div>`;
      return out.slice(0, 60).map(item => `<button class="search-result" type="button" ${item.action}><span class="search-type">${escapeHtml(item.type)}</span><span class="search-title">${escapeHtml(item.title)}</span>${item.text ? `<span class="search-text">${escapeHtml(item.text)}</span>` : ""}</button>`).join("");
    }

    function createProject() {
      const t = now();
      const node = { id: uid("box"), parentId: null, level: 1, title: "Untitled", boxNoteHtml: "", archivedAt: null, sort: boxRoots().length + 1, createdAt: t, updatedAt: t };
      db.boxNodes.push(node);
      db.ui.boxView = "active";
      createdFlashId = node.id;
      syncSelectedActionDayWithBox();
      if (route().name !== "box") {
        cacheLocal();
        queueCloudSave();
        goBoxHome();
      } else {
        persist({ renderAfter: true });
      }
      setTimeout(() => focusBoxTitle(node.id), 80);
      setTimeout(() => { if (createdFlashId === node.id) { createdFlashId = null; render(); } }, 900);
    }

    function createBoxChild(parentId) {
      const parent = getBoxNode(parentId);
      if (!parent || parent.level >= 5) return;
      const t = now();
      const child = { id: uid("sub"), parentId: parent.id, level: parent.level + 1, title: "Untitled", boxNoteHtml: "", archivedAt: null, sort: childrenOf(parent.id, db.boxNodes).length + 1, createdAt: t, updatedAt: t };
      parent.updatedAt = t;
      db.boxNodes.push(child);
      createdFlashId = child.id;
      expandInArray("expandedBoxNodes", parent.id);
      syncSelectedActionDayWithBox();
      persist({ renderAfter: true });
      setTimeout(() => focusBoxTitle(child.id), 80);
      setTimeout(() => { if (createdFlashId === child.id) { createdFlashId = null; render(); } }, 900);
    }

    function hardDeleteBoxNode(id, message = "Đã xoá") {
      const node = getBoxNode(id);
      if (!node) return;
      const ids = new Set([id, ...descendantsOf(id, db.boxNodes).map(n => n.id)]);
      const snapshot = db.boxNodes.filter(n => ids.has(n.id)).map(n => ({ ...n }));
      db.boxNodes = db.boxNodes.filter(n => !ids.has(n.id));
      db.ui.collapsedBoxNodes = (db.ui.collapsedBoxNodes || []).filter(x => !ids.has(x));
      db.ui.expandedBoxNodes = (db.ui.expandedBoxNodes || []).filter(x => !ids.has(x));
      syncSelectedActionDayWithBox();
      persist({ renderAfter: true });
      showSnack(message, () => {
        const existing = new Set(db.boxNodes.map(n => n.id));
        snapshot.forEach(n => { if (!existing.has(n.id)) db.boxNodes.push(n); });
        persist({ renderAfter: true });
      });
      if (route().name === "boxEditor" && node.parentId === null) goBoxHome();
    }

    function archiveBoxNode(id) {
      const node = getBoxNode(id);
      if (!node) return;
      const ids = new Set([id, ...descendantsOf(id, db.boxNodes).map(n => n.id)]);
      const snapshot = db.boxNodes.filter(n => ids.has(n.id)).map(n => ({ id: n.id, archivedAt: n.archivedAt || null, doneAt: n.doneAt || null, updatedAt: n.updatedAt }));
      const t = now();
      db.boxNodes.forEach(n => {
        if (ids.has(n.id)) {
          n.archivedAt = t;
          n.doneAt = null;
          n.updatedAt = t;
        }
      });
      syncSelectedActionDayWithBox();
      persist({ renderAfter: true });
      showSnack("Đã đưa vào Archive", () => {
        snapshot.forEach(prev => { const current = getBoxNode(prev.id); if (current) { current.archivedAt = prev.archivedAt; current.doneAt = prev.doneAt; current.updatedAt = prev.updatedAt; } });
        syncSelectedActionDayWithBox();
        persist({ renderAfter: true });
      });
    }

    function doneBoxNode(id) {
      const node = getBoxNode(id);
      if (!node) return;
      const ids = new Set([id, ...descendantsOf(id, db.boxNodes).map(n => n.id)]);
      const snapshot = db.boxNodes.filter(n => ids.has(n.id)).map(n => ({ id: n.id, archivedAt: n.archivedAt || null, doneAt: n.doneAt || null, updatedAt: n.updatedAt }));
      const t = now();
      db.boxNodes.forEach(n => {
        if (ids.has(n.id)) {
          n.doneAt = t;
          n.archivedAt = null;
          n.updatedAt = t;
        }
      });
      db.ui.boxView = "done";
      syncSelectedActionDayWithBox();
      persist({ renderAfter: true });
      showSnack("Đã đưa vào Done", () => {
        snapshot.forEach(prev => { const current = getBoxNode(prev.id); if (current) { current.archivedAt = prev.archivedAt; current.doneAt = prev.doneAt; current.updatedAt = prev.updatedAt; } });
        db.ui.boxView = "active";
        syncSelectedActionDayWithBox();
        persist({ renderAfter: true });
      });
    }

    function restoreBoxNode(id) {
      const node = getBoxNode(id);
      if (!node) return;
      const ids = new Set([id, ...descendantsOf(id, db.boxNodes).map(n => n.id)]);
      ancestorsOf(id, db.boxNodes).forEach(n => ids.add(n.id));
      const snapshot = db.boxNodes.filter(n => ids.has(n.id)).map(n => ({ id: n.id, archivedAt: n.archivedAt || null, doneAt: n.doneAt || null, updatedAt: n.updatedAt }));
      const t = now();
      db.boxNodes.forEach(n => {
        if (ids.has(n.id)) {
          n.archivedAt = null;
          n.doneAt = null;
          n.updatedAt = t;
        }
      });
      db.ui.boxView = "active";
      syncSelectedActionDayWithBox();
      persist({ renderAfter: true });
      showSnack("Đã khôi phục", () => {
        snapshot.forEach(prev => { const current = getBoxNode(prev.id); if (current) { current.archivedAt = prev.archivedAt; current.doneAt = prev.doneAt; current.updatedAt = prev.updatedAt; } });
        syncSelectedActionDayWithBox();
        persist({ renderAfter: true });
      });
    }

    function deleteBoxNode(id) {
      const node = getBoxNode(id);
      if (!node) return;
      if (boxSubtreeHasStoredData(id)) {
        archiveBoxNode(id);
        return;
      }
      hardDeleteBoxNode(id);
    }

    function createActionsForDate(date = todayYMD()) {
      const selectedDate = /^\d{4}-\d{2}-\d{2}$/.test(String(date || "")) ? date : todayYMD();
      const existing = getDayByDate(selectedDate);
      if (existing) {
        db.ui.selectedActionDate = selectedDate;
        persist({ renderAfter: true });
        return;
      }
      const roots = boxRoots();
      if (!roots.length) { showSnack("Chưa có box", null, 1600); return goBoxHome(); }
      const t = now();
      const day = { id: uid("day"), date: selectedDate, createdAt: t, updatedAt: t, nodes: [] };
      syncActionDayWithBox(day);
      db.actionDays.push(day);
      db.ui.selectedActionDate = selectedDate;
      persist({ renderAfter: true });
    }

    function createTodayActions() { createActionsForDate(todayYMD()); }

    function autoSyncTodayStructure() {
      const day = db.actionDays.find(item => item.date === todayYMD());
      if (!day) return false;
      const changed = syncActionDayWithBox(day);
      if (changed) {
        cacheLocal();
        queueCloudSave();
      }
      return changed;
    }

    function syncSelectedActionDayWithBox(date = db.ui.selectedActionDate) {
      const day = getDayByDate(date || todayYMD());
      if (!day) return false;
      const changed = syncActionDayWithBox(day);
      if (changed) {
        cacheLocal();
        queueCloudSave();
      }
      return changed;
    }

    function actionStructureSignature(nodes) {
      return JSON.stringify((nodes || []).map(n => ({
        id: n.id,
        parentId: n.parentId ?? null,
        level: n.level,
        title: n.title,
        sort: n.sort,
        sourceBoxNodeId: n.sourceBoxNodeId || null,
        archivedAt: n.archivedAt || null,
        entryIds: entriesFor(n).map(e => e.id)
      })));
    }

    function boxPathFor(node) {
      return [...ancestorsOf(node.id, db.boxNodes), node].map(n => cleanTitle(n.title)).join(" › ");
    }

    function syncActionDayWithBox(day) {
      if (!day) return false;
      const before = actionStructureSignature(day.nodes || []);
      const t = now();
      const existingBySource = new Map();
      (day.nodes || []).forEach(node => {
        if (node.sourceBoxNodeId) existingBySource.set(node.sourceBoxNodeId, node);
      });
      const next = [];
      function shouldIncludeBox(boxNode) {
        if (!boxIsInactive(boxNode)) return true;
        return actionDayHasEntriesForBoxSubtree(day, boxNode.id);
      }
      function clone(boxNode, parentCloneId) {
        if (!shouldIncludeBox(boxNode)) return null;
        const matched = existingBySource.get(boxNode.id);
        const cloned = {
          id: rememberId(matched?.id || uid("actionnode")),
          parentId: parentCloneId,
          level: boxNode.level,
          title: cleanTitle(boxNode.title),
          archivedAt: boxNode.archivedAt || null,
          sort: Number.isFinite(+boxNode.sort) ? +boxNode.sort : childrenOf(boxNode.parentId, db.boxNodes).indexOf(boxNode) + 1,
          sourceBoxNodeId: boxNode.id,
          entries: normalizeEntries(matched || {}),
          done: Boolean(matched?.done),
          createdAt: matched?.createdAt || t,
          updatedAt: matched?.updatedAt || t
        };
        next.push(cloned);
        childrenOf(boxNode.id, db.boxNodes).forEach(child => clone(child, cloned.id));
        return cloned;
      }
      boxRoots().forEach(root => clone(root, null));
      day.nodes = next;
      const after = actionStructureSignature(day.nodes);
      if (before !== after) {
        day.updatedAt = t;
        return true;
      }
      return false;
    }

    function toggleInArray(key, id) {
      db.ui[key] = db.ui[key] || [];
      const set = new Set(db.ui[key]);
      set.has(id) ? set.delete(id) : set.add(id);
      db.ui[key] = [...set];
      persist({ renderAfter: true });
    }
    function uncollapse(key, id) { db.ui[key] = (db.ui[key] || []).filter(x => x !== id); }
    function expandInArray(key, id) { db.ui[key] = [...new Set([...(db.ui[key] || []), id])]; }

    function updateBoxTitle(id, text) {
      const node = getBoxNode(id);
      if (!node) return;
      const nextTitle = cleanTitle(text);
      if (node.title === nextTitle) return;
      node.title = nextTitle;
      node.updatedAt = now();
      syncActionTitlesFromBoxes(db, id);
      syncSelectedActionDayWithBox();
      scheduleSave();
    }

    function updateBoxNote(id, html) {
      const node = getBoxNode(id);
      if (!node || node.level !== 1) return;
      const nextHtml = sanitizeHtml(html || "");
      if ((node.boxNoteHtml || "") === nextHtml) return;
      node.boxNoteHtml = nextHtml;
      node.updatedAt = now();
      scheduleSave();
    }

    function updateActionContent(dayId, nodeId, html) {
      const node = getActionNode(dayId, nodeId);
      const day = getDay(dayId);
      if (!node || !day) return;
      node.entries = normalizeEntries(node);
      node.entries.push(normalizeEntry({ type: "note", title: "Note", bodyHtml: sanitizeHtml(html || "") }, node.entries.length));
      node.updatedAt = now();
      day.updatedAt = now();
      scheduleSave();
    }

    function findEntry(dayId, nodeId, entryId) {
      const node = getActionNode(dayId, nodeId);
      const day = getDay(dayId);
      const entry = node ? entriesFor(node).find(e => e.id === entryId) : null;
      return { day, node, entry };
    }

    function addActionEntries(dayId, nodeId, lines) {
      const node = getActionNode(dayId, nodeId);
      const day = getDay(dayId);
      if (!node || !day) return;
      if (node.level <= 1) { showSnack("Chọn sub-box để thêm action", null, 1800); entryModal = null; actionMenuOpenFor = null; render(); return; }
      const cleaned = String(lines || "").split(/\n+/).map(cleanTitle).filter(Boolean);
      if (!cleaned.length) return;
      const t = now();
      node.entries = normalizeEntries(node);
      cleaned.forEach(text => node.entries.push(normalizeEntry({ type: "action", text, createdAt: t, updatedAt: t }, node.entries.length)));
      node.updatedAt = t;
      day.updatedAt = t;
      db.ui.actionFilter = "all";
      expandActionAncestors(day, nodeId);
      entryModal = null;
      actionMenuOpenFor = null;
      persist({ renderAfter: true });
    }

    function saveNoteEntry(dayId, nodeId, entryId, title, bodyHtmlInput) {
      const node = getActionNode(dayId, nodeId);
      const day = getDay(dayId);
      if (!node || !day) return;
      if (node.level <= 1) { showSnack("Chọn sub-box để thêm notes", null, 1800); entryModal = null; actionMenuOpenFor = null; render(); return; }
      const t = now();
      node.entries = normalizeEntries(node);
      let entry = entryId ? node.entries.find(e => e.id === entryId) : null;
      const bodyHtml = sanitizeHtml(bodyHtmlInput || "");
      if (entry) {
        entry.title = cleanTitle(title || "Note");
        entry.bodyHtml = bodyHtml;
        entry.updatedAt = t;
      } else {
        node.entries.push(normalizeEntry({ type: "note", title: title || "Note", bodyHtml, createdAt: t, updatedAt: t }, node.entries.length));
      }
      node.updatedAt = t;
      day.updatedAt = t;
      db.ui.actionFilter = "all";
      expandActionAncestors(day, nodeId);
      entryModal = null;
      actionMenuOpenFor = null;
      persist({ renderAfter: true });
    }

    function updateActionEntryText(dayId, nodeId, entryId, text) {
      const { day, node, entry } = findEntry(dayId, nodeId, entryId);
      if (!day || !node || !entry || entry.type !== "action") return;
      entry.text = cleanTitle(text || "Action");
      entry.updatedAt = now();
      node.updatedAt = entry.updatedAt;
      day.updatedAt = entry.updatedAt;
      scheduleSave();
    }

    function toggleEntryDone(dayId, nodeId, entryId) {
      const { day, node, entry } = findEntry(dayId, nodeId, entryId);
      if (!day || !node || !entry || entry.type !== "action") return;
      entry.done = !entry.done;
      entry.updatedAt = now();
      node.updatedAt = entry.updatedAt;
      day.updatedAt = entry.updatedAt;
      persist({ renderAfter: true });
    }

    function deleteEntry(dayId, nodeId, entryId) {
      const { day, node, entry } = findEntry(dayId, nodeId, entryId);
      if (!day || !node || !entry) return;
      const index = node.entries.findIndex(e => e.id === entryId);
      const snapshot = { ...entry };
      node.entries.splice(index, 1);
      node.updatedAt = now();
      day.updatedAt = now();
      persist({ renderAfter: true });
      showSnack("Đã xoá", () => {
        const current = getActionNode(dayId, nodeId);
        const d = getDay(dayId);
        if (!current || !d) return;
        current.entries = normalizeEntries(current);
        current.entries.splice(Math.max(0, index), 0, snapshot);
        current.updatedAt = now();
        d.updatedAt = now();
        persist({ renderAfter: true });
      });
    }

    function toggleDone(dayId, nodeId) {
      const node = getActionNode(dayId, nodeId);
      const day = getDay(dayId);
      if (!node || !day) return;
      const actions = actionEntriesFor(node);
      if (!actions.length) return;
      const shouldDone = actions.some(e => !e.done);
      actions.forEach(e => { e.done = shouldDone; e.updatedAt = now(); });
      node.updatedAt = now();
      day.updatedAt = now();
      persist({ renderAfter: true });
    }

    function exportJson() {
      const blob = new Blob([JSON.stringify(sanitizedState(db), null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `idea-box-backup-${todayYMD()}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 500);
      toolsOpen = false;
      render();
    }

    async function importJson(file) {
      if (!file) return;
      try {
        const text = await file.text();
        const next = normalizeState(JSON.parse(text));
        const before = sanitizedState(db);
        db = next;
        persist({ renderAfter: true });
        showSnack("Đã import", () => { db = before; persist({ renderAfter: true }); });
      } catch (error) {
        console.error(error);
        showSnack("File không hợp lệ", null, 1800);
      }
    }

    function focusBoxTitle(id) {
      const el = document.querySelector(`[data-box-title="${CSS.escape(id)}"]`);
      if (!el) return;
      el.focus(); selectAll(el);
    }
    function selectAll(el) { const range = document.createRange(); range.selectNodeContents(el); const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range); }

    function showSnack(message, undo = null, ms = 3600) {
      snackbarText.textContent = message;
      undoHandler = undo;
      snackbarAction.style.display = undo ? "inline-grid" : "none";
      snackbar.classList.add("show");
      clearTimeout(snackTimer);
      snackTimer = setTimeout(hideSnack, ms);
    }
    function hideSnack() { snackbar.classList.remove("show"); undoHandler = null; }


    function selectActionDate(date) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(String(date || ""))) return;
      db.ui.selectedActionDate = date;
      cacheLocal();
      render();
    }

    function addDaysYMD(ymd, offset) {
      const parts = String(ymd || todayYMD()).split("-").map(Number);
      if (parts.length !== 3 || parts.some(Number.isNaN)) return todayYMD();
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      d.setDate(d.getDate() + Number(offset || 0));
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    function shiftActionDate(offset) {
      selectActionDate(addDaysYMD(db.ui.selectedActionDate || todayYMD(), offset));
    }

    function openDatePicker() {
      const input = document.querySelector("[data-action-date-picker]");
      if (!input) return;
      if (typeof input.showPicker === "function") input.showPicker();
      else input.click();
    }

    app.addEventListener("submit", event => {
      const form = event.target.closest("[data-auth-form]");
      if (!form) return;
      event.preventDefault();
      handleAuth(event.submitter?.dataset?.authAction || "login");
    });

    app.addEventListener("click", event => {
      if (Date.now() < suppressOpenUntil) return;
      const target = event.target;

      if (target.closest("[data-sign-out]")) { signOut(); return; }
      if (target.closest("[data-open-tools]")) { toolsOpen = true; render(); return; }
      if (target.matches("[data-close-tools]") && !target.closest("[data-tools-sheet]")) { toolsOpen = false; render(); return; }
      if (target.closest("[data-export-json]")) { exportJson(); return; }
      if (target.closest("[data-import-json]")) { document.querySelector("[data-import-file]")?.click(); return; }
      if (target.closest("[data-open-search]")) { toolsOpen = false; openSearch(); return; }

      const saveActionLines = target.closest("[data-save-action-lines]");
      if (saveActionLines && entryModal?.type === "action") {
        const lines = document.querySelector("[data-action-lines]")?.value || "";
        addActionEntries(entryModal.dayId, entryModal.nodeId, lines);
        return;
      }
      const saveNote = target.closest("[data-save-note-entry]");
      if (saveNote && entryModal?.type === "note") {
        const title = document.querySelector("[data-note-title-input]")?.value || "";
        const body = document.querySelector("[data-note-body-editor]")?.innerHTML || "";
        saveNoteEntry(entryModal.dayId, entryModal.nodeId, entryModal.entryId || null, title, body);
        return;
      }
      const saveBoxNote = target.closest("[data-save-box-note-modal]");
      if (saveBoxNote && entryModal?.type === "boxNote") {
        const body = document.querySelector("[data-box-note-modal-editor]")?.innerHTML || "";
        updateBoxNote(entryModal.boxId, body);
        entryModal = null;
        persist({ renderAfter: true });
        return;
      }
      const closeEntryBackdrop = target.matches("[data-close-entry-modal]") && !target.closest("[data-entry-modal-card]");
      const closeEntryButton = target.closest("button[data-close-entry-modal]");
      if (closeEntryBackdrop || closeEntryButton) { entryModal = null; render(); return; }


      const tab = target.closest("[data-tab]");
      if (tab) { tab.dataset.tab === "actions" ? goActionsHome() : goBoxHome(); return; }
      if (target.closest("[data-create-project]")) { createProject(); return; }
      const shiftDate = target.closest("[data-shift-action-date]");
      if (shiftDate) { shiftActionDate(Number(shiftDate.dataset.shiftActionDate || 0)); return; }
      if (target.closest("[data-trigger-date-picker]")) { openDatePicker(); return; }
      const createForDate = target.closest("[data-create-actions-for-date]");
      if (createForDate) { createActionsForDate(createForDate.dataset.createActionsForDate); return; }
      if (target.closest("[data-create-today-actions]")) { createTodayActions(); return; }
      const back = target.closest("[data-back-home]");
      if (back) { back.dataset.backHome === "actions" ? goActionsHome() : goBoxHome(); return; }
      if (target.closest("[data-back-smart]")) { history.length > 1 ? history.back() : goBoxHome(); return; }

      const boxView = target.closest("[data-box-view]");
      if (boxView) {
        db.ui.boxView = boxView.dataset.boxView || "active";
        db.ui.boxDateRangeOpen = false;
        persist({ renderAfter: true });
        return;
      }

      const chip = target.closest("[data-filter-kind]");
      if (chip) {
        if (chip.dataset.filterKind === "box-filter") { db.ui.boxFilter = chip.dataset.filterValue; db.ui.boxDateRangeOpen = false; }
        if (chip.dataset.filterKind === "action-filter") db.ui.actionFilter = (db.ui.actionFilter === chip.dataset.filterValue && chip.dataset.filterValue !== "all") ? "all" : chip.dataset.filterValue;
        persist({ renderAfter: true });
        return;
      }
      if (target.closest("[data-toggle-box-date-range]")) {
        db.ui.boxDateRangeOpen = !db.ui.boxDateRangeOpen;
        if (db.ui.boxDateRangeOpen) db.ui.boxFilter = "custom";
        persist({ renderAfter: true });
        return;
      }
      if (target.closest("[data-apply-box-date-range]")) {
        db.ui.boxFilter = "custom";
        db.ui.boxDateRangeOpen = false;
        persist({ renderAfter: true });
        return;
      }
      if (target.closest("[data-close-box-search]")) { boxSearchOpen = false; boxSearchQuery = ""; render(); return; }

      const openMenu = target.closest("[data-open-entry-menu]");
      if (openMenu) {
        event.stopPropagation();
        const key = `${openMenu.dataset.dayId}:${openMenu.dataset.openEntryMenu}`;
        actionMenuOpenFor = actionMenuOpenFor === key ? null : key;
        render();
        return;
      }
      const newAction = target.closest("[data-new-action-entry]");
      if (newAction) {
        event.stopPropagation();
        entryModal = { type: "action", dayId: newAction.dataset.dayId, nodeId: newAction.dataset.newActionEntry };
        actionMenuOpenFor = null;
        render();
        setTimeout(() => document.querySelector("[data-action-lines]")?.focus(), 50);
        return;
      }
      const newNote = target.closest("[data-new-note-entry]");
      if (newNote) {
        event.stopPropagation();
        entryModal = { type: "note", dayId: newNote.dataset.dayId, nodeId: newNote.dataset.newNoteEntry, entryId: null, entry: null };
        actionMenuOpenFor = null;
        render();
        setTimeout(() => document.querySelector("[data-note-title-input]")?.focus(), 50);
        return;
      }
      const openActionEarly = target.closest("[data-open-action-day][data-open-action-node]");
      if (openActionEarly) { openActionDay(openActionEarly.dataset.openActionDay, openActionEarly.dataset.openActionNode); return; }
      const openNote = target.closest("[data-open-note-entry]");
      if (openNote && openNote.dataset.dayId && (openNote.dataset.nodeId || openNote.closest("[data-action-node-id]"))) {
        event.stopPropagation();
        const nodeId = openNote.dataset.nodeId || openNote.closest("[data-action-node-id]")?.dataset.actionNodeId;
        const { entry } = findEntry(openNote.dataset.dayId, nodeId, openNote.dataset.openNoteEntry);
        entryModal = { type: "note", dayId: openNote.dataset.dayId, nodeId, entryId: openNote.dataset.openNoteEntry, entry: entry || null };
        render();
        return;
      }
      const delEntry = target.closest("[data-delete-entry]");
      if (delEntry) {
        event.stopPropagation();
        deleteEntry(delEntry.dataset.dayId, delEntry.dataset.nodeId, delEntry.dataset.deleteEntry);
        return;
      }
      const boxNote = target.closest("[data-toggle-box-note]");
      if (boxNote) {
        event.stopPropagation();
        entryModal = { type: "boxNote", boxId: boxNote.dataset.toggleBoxNote };
        render();
        setTimeout(() => document.querySelector("[data-box-note-modal-editor]")?.focus(), 80);
        return;
      }
      const add = target.closest("[data-add-box-child]");
      if (add) { event.stopPropagation(); createBoxChild(add.dataset.addBoxChild); return; }
      const doneBox = target.closest("[data-done-box-node]");
      if (doneBox) { event.stopPropagation(); doneBoxNode(doneBox.dataset.doneBoxNode); return; }
      const restoreBox = target.closest("[data-restore-box-node]");
      if (restoreBox) { event.stopPropagation(); restoreBoxNode(restoreBox.dataset.restoreBoxNode); return; }
      const del = target.closest("[data-delete-box-node]");
      if (del) { event.stopPropagation(); deleteBoxNode(del.dataset.deleteBoxNode); return; }
      const toggleBox = target.closest("[data-toggle-box-node]");
      if (toggleBox && !target.closest("[contenteditable], button")) { toggleInArray("expandedBoxNodes", toggleBox.dataset.toggleBoxNode); return; }
      const toggleAction = target.closest("[data-toggle-action-node]");
      if (toggleAction && !target.closest("button, input, [contenteditable], .entry-text")) { toggleInArray("collapsedActionNodes", toggleAction.dataset.toggleActionNode); return; }
      const entryDone = target.closest("[data-toggle-entry-done]");
      if (entryDone) { event.stopPropagation(); toggleEntryDone(entryDone.dataset.dayId, entryDone.dataset.nodeId, entryDone.dataset.toggleEntryDone); return; }
      const done = target.closest("[data-toggle-done]");
      if (done) { event.stopPropagation(); toggleDone(done.dataset.dayId, done.dataset.toggleDone); return; }
      const summaryToggle = target.closest("[data-toggle-summary]");
      if (summaryToggle) { toggleInArray("expandedSummaryDays", summaryToggle.dataset.toggleSummary); return; }
      const openDay = target.closest("[data-open-action-day-only]");
      if (openDay) { const day = getDay(openDay.dataset.openActionDayOnly); if (day) selectActionDate(day.date); return; }
      const openBoxCard = target.closest("[data-open-box]");
      if (openBoxCard && !target.closest("[contenteditable], button, .summary-action")) { openBox(openBoxCard.dataset.openBox); return; }
    });

    app.addEventListener("input", event => {
      const boxTitle = event.target.closest("[data-box-title]");
      if (boxTitle) { updateBoxTitle(boxTitle.dataset.boxTitle, boxTitle.textContent); return; }
      const boxNoteEditor = event.target.closest("[data-box-note-editor]");
      if (boxNoteEditor) { updateBoxNote(boxNoteEditor.dataset.boxNoteEditor, boxNoteEditor.innerHTML); return; }
      const entryTextEl = event.target.closest("[data-entry-action-text]");
      if (entryTextEl) { updateActionEntryText(entryTextEl.dataset.dayId, entryTextEl.dataset.nodeId, entryTextEl.dataset.entryActionText, entryTextEl.textContent); return; }
      const boxSearch = event.target.closest("[data-box-search-input]");
      if (boxSearch) { boxSearchQuery = boxSearch.value; const results = document.getElementById("boxSearchResults"); if (results) results.innerHTML = renderBoxSearchResults(boxSearchQuery); return; }
      const search = event.target.closest("[data-search-input]");
      if (search) { searchQuery = search.value; document.getElementById("searchResults").innerHTML = renderSearchResults(searchQuery); }
    });

    app.addEventListener("change", event => {
      const fileInput = event.target.closest("[data-import-file]");
      if (fileInput) importJson(fileInput.files?.[0]);
      const dateInput = event.target.closest("[data-action-date-picker]");
      if (dateInput) selectActionDate(dateInput.value);
      const fromInput = event.target.closest("[data-box-filter-from]");
      if (fromInput) { db.ui.boxFilterFrom = fromInput.value; db.ui.boxFilter = "custom"; cacheLocal(); render(); return; }
      const toInput = event.target.closest("[data-box-filter-to]");
      if (toInput) { db.ui.boxFilterTo = toInput.value; db.ui.boxFilter = "custom"; cacheLocal(); render(); return; }
    });

    app.addEventListener("keydown", event => {
      const title = event.target.closest("[data-box-title]");
      if (title && event.key === "Enter") { event.preventDefault(); title.blur(); }
    });

    app.addEventListener("paste", event => {
      const title = event.target.closest("[data-box-title]");
      const entryTextEl = event.target.closest("[data-entry-action-text]");
      const editor = event.target.closest(".rich-editor");
      if (!title && !entryTextEl && !editor) return;
      event.preventDefault();
      const text = (event.clipboardData || window.clipboardData).getData("text/plain");
      document.execCommand("insertText", false, title || entryTextEl ? text.replace(/\s+/g, " ") : text);
    });

    app.addEventListener("focusin", event => {
      const editor = event.target.closest(".rich-editor");
      if (editor) { activeEditor = editor; captureSelection(); showFormatBar(); }
    });

    app.addEventListener("focusout", event => {
      const editor = event.target.closest(".rich-editor");
      if (!editor) return;
      editor.innerHTML = sanitizeHtml(editor.innerHTML);
      if (editor.dataset.boxNoteEditor) updateBoxNote(editor.dataset.boxNoteEditor, editor.innerHTML);
      if (editor.dataset.dayId && editor.dataset.actionContent) updateActionContent(editor.dataset.dayId, editor.dataset.actionContent, editor.innerHTML);
      setTimeout(() => {
        const active = document.activeElement;
        if (!active || (!active.closest(".rich-editor") && !active.closest("#formatBar"))) hideFormatBar();
      }, 160);
    });

    app.addEventListener("pointerdown", event => {
      const handle = event.target.closest("[data-drag-handle]");
      if (!handle) return;
      const card = handle.closest(".project-card");
      const stack = document.getElementById("projectStack");
      if (!card || !stack) return;
      event.preventDefault();
      dragState = { card, stack, startY: event.clientY, moved: false, pointerId: event.pointerId };
      stack.classList.add("dragging");
      card.classList.add("dragging");
      try { handle.setPointerCapture(event.pointerId); } catch {}
    });

    document.addEventListener("pointermove", event => {
      if (!dragState) return;
      event.preventDefault();
      if (Math.abs(event.clientY - dragState.startY) > 4) dragState.moved = true;
      const after = getDragAfterElement(dragState.stack, event.clientY);
      if (!after) dragState.stack.appendChild(dragState.card);
      else dragState.stack.insertBefore(dragState.card, after);
    }, { passive: false });
    document.addEventListener("pointerup", finishDrag);
    document.addEventListener("pointercancel", finishDrag);

    function finishDrag() {
      if (!dragState) return;
      dragState.card.classList.remove("dragging");
      dragState.stack.classList.remove("dragging");
      if (dragState.moved) { suppressOpenUntil = Date.now() + 350; saveProjectOrderFromDom(dragState.stack); }
      dragState = null;
    }
    function getDragAfterElement(container, y) {
      const items = [...container.querySelectorAll(".project-card:not(.dragging)")];
      return items.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) return { offset, element: child };
        return closest;
      }, { offset: Number.NEGATIVE_INFINITY, element: null }).element;
    }
    function saveProjectOrderFromDom(stack) {
      [...stack.querySelectorAll("[data-root-card]")].forEach((el, index) => {
        const node = getBoxNode(el.dataset.rootCard);
        if (node) node.sort = index + 1;
      });
      persist();
    }

    document.addEventListener("selectionchange", () => {
      if (!activeEditor) return;
      const sel = window.getSelection();
      if (!sel || !sel.rangeCount) return;
      const node = sel.anchorNode;
      if (node && activeEditor.contains(node)) savedRange = sel.getRangeAt(0).cloneRange();
    });
    formatBar.addEventListener("pointerdown", event => event.preventDefault());
    formatBar.addEventListener("click", event => {
      const done = event.target.closest("[data-done]");
      if (done) { activeEditor?.blur(); hideFormatBar(); return; }
      if (!activeEditor) return;
      restoreSelection();
      const cycle = event.target.closest("[data-cycle-block]");
      if (cycle) {
        const tag = selectionBlockTag();
        const next = tag === "H2" ? "p" : tag === "H3" ? "h2" : "h3";
        document.execCommand("formatBlock", false, next);
      } else {
        const btn = event.target.closest("[data-cmd]");
        if (!btn) return;
        document.execCommand(btn.dataset.cmd, false, btn.dataset.value || null);
      }
      activeEditor.innerHTML = sanitizeHtml(activeEditor.innerHTML);
      activeEditor.focus();
      captureSelection();
      if (activeEditor.dataset.dayId && activeEditor.dataset.actionContent) updateActionContent(activeEditor.dataset.dayId, activeEditor.dataset.actionContent, activeEditor.innerHTML);
    });
    function showFormatBar() { formatBar.classList.add("show"); formatBar.setAttribute("aria-hidden", "false"); }
    function hideFormatBar() { formatBar.classList.remove("show"); formatBar.setAttribute("aria-hidden", "true"); activeEditor = null; savedRange = null; }
    function captureSelection() { const sel = window.getSelection(); if (sel && sel.rangeCount) savedRange = sel.getRangeAt(0).cloneRange(); }
    function restoreSelection() { if (!savedRange) return; const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(savedRange); }
    function selectionBlockTag() {
      const sel = window.getSelection();
      if (!sel || !sel.anchorNode) return "";
      let node = sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement;
      while (node && node !== activeEditor) { if (/^(H1|H2|H3|P|DIV|BLOCKQUOTE)$/.test(node.tagName)) return node.tagName; node = node.parentElement; }
      return "";
    }

    snackbarAction.addEventListener("click", () => { const fn = undoHandler; hideSnack(); if (fn) fn(); });
    window.addEventListener("online", () => { setSync("saving", "Saving"); queueCloudSave(); });
    window.addEventListener("offline", () => setSync("offline", "Offline"));
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && currentUser) {
        ensureFreshSession().then(() => { if (navigator.onLine) queueCloudSave(); }).catch(() => setSync("offline", "Local saved"));
      }
    });
    window.addEventListener("hashchange", () => { toolsOpen = false; render(); });
    window.addEventListener("DOMContentLoaded", bootstrap);
  </script>
</body>
</html>
